<!DOCTYPE html>
<html>

<body>
    <div id="root"></div>
</body>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script async src="https://ga.jspm.io/npm:es-module-shims@1.7.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react?dev",
    "react-dom/client": "https://esm.sh/react-dom/client?dev"
  }
}
</script>
<script type="text/babel" data-type="module">
  import React, { StrictMode } from 'react';
  import { createRoot } from 'react-dom/client';

  import { useState } from 'react';

  function App() {
    /*
      Exercise:
        Create an Image component
        This will display an image
        Create a ChangeImage button
        Everytime this button is clicked, it will display the next image
        The images will cycle through 3 predetermined images


    */


    // [variable, functionToChangeVariable] = useState(initial value of variable)
    const [count, changeCount] = useState(0);
    const [imageIndex, changeImageIndex] = useState(0);

    function buttonClick() {
      changeCount(count + 1)
    }

    function decrementCount() {
      changeCount(count - 1);
    }

    function resetCount() {
      changeCount(0);
    }

    function changeImage() {
      changeImageIndex( (imageIndex+1)%imageDataArray.length );
    }
    /*
    let count = 0;
    button.addEventListener("click", () => {
      count++;
      button.innerText = `This has been clicked ${count} times`;
    })
    */
    const paragraphs = [];
    for (let i=0; i<20; i++) {
      paragraphs.push(<Paragrapgh key={i} paragraphNum={i}/>)
    }

    const MusicDataArray = [
      {
        song: "We Are The Champions",
        artist: "Queen",
        rating: 5
      },
      { song: "Never Gonna Give You Up", artist: "Risk Astley", rating: 5 },
      { song: "Coffee and TV", artist: "Blur", rating: 4 },
      { song: "Sharks", artist: "Imagine Dragons", rating: 4 }
    ];

    const MusicComponents = [];
    MusicDataArray.forEach(Music => {
      MusicComponents.push(<MusicData Music={Music} />)
    })

    const imageDataArray = [
      { src: "img1.png", alt: "img1" },
      { src: "img2.png", alt: "img2" },
      { src: "img3.png", alt: "img3" }
    ]

    return(
      <div>
        <h1>Welecome to the website!</h1>
        <p>I hope you like it</p>
        <CountButton parameter={"value"} count={count} buttonClick={resetCount} />
        <Paragrapgh paragraphNum={"a"}/>
        <Paragrapgh paragraphNum={"b"}/>
        <Paragrapgh paragraphNum={28}/>
        <Paragrapgh paragraphNum={count}/>
        <Image ImageData={imageDataArray[imageIndex]} />
        <ChangeImageButton changeImage={changeImage}/>
        <CountButton parameter={"value"} count={count} buttonClick={buttonClick} />
        {MusicComponents}
        {paragraphs}
      </div>
    )
  }

  function Paragrapgh({paragraphNum}) {
    return(
      <p>This is a paragraph! This is paragraph number: {paragraphNum}</p>
    )
  }

  function CountButton( {count, buttonClick} ) {
    return(
      <button onClick={buttonClick}>This has been clicked {count} times</button>
    )
  }


  function MusicData( {Music} ) {
    return(
      <ul>
        <li>Song: {Music.song}</li>
        <li>Artist: {Music.artist}</li>
        <li>Rating: {Music.rating}/5</li>
      </ul>
    )
  }

  function Image( {ImageData} ) {
    return(
      <img src={ImageData.src} alt={ImageData.alt} />
    )
  }

  function ChangeImageButton({changeImage}) {
    return(
      <button onClick={changeImage}>Change Image</button>
    )
  }

  const root = createRoot(document.getElementById("root"));
  root.render(
    <App/>
  );
</script>
</html>
